name: Refresh site

# Rebuilds every page once a day so countdowns, order-by dates, the contest round
# and the video shelf stay current, and whenever the source changes.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '_build/**'
      - 'assets/**'
      - 'CNAME'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh-site
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh the video shelf
        run: node _build/refresh.mjs
        continue-on-error: true
      - name: Build every page
        run: node _build/build.mjs
      - name: Commit what changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh site $(date -u +%F)"
            git pull --rebase --autostash origin main
            git push
          fi
